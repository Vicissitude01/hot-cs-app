name: build-apk
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Run unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test-log.txt
      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee /tmp/build-log.txt
      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "### 编译错误行"
            grep -nE "^e: |error:|FAILURE:|FAILED|Compilation error" /tmp/test-log.txt /tmp/build-log.txt 2>/dev/null | head -60
            echo
            echo "### build-log 末尾 200 行"
            tail -200 /tmp/build-log.txt 2>/dev/null || echo "(无 build 日志)"
          } > /tmp/diag.txt
          echo "diagnostic lines: $(wc -l < /tmp/diag.txt)"
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish latest release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "最新版" --notes "直接下载 app-release.apk 安装即可" \
            app/build/outputs/apk/release/*.apk 2>/dev/null || \
          gh release upload latest app/build/outputs/apk/release/*.apk --clobber
      - name: Create diagnostic issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          body = open('/tmp/diag.txt', encoding='utf-8').read()
          repo = os.environ['GITHUB_REPOSITORY']; token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues?state=open&per_page=100',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'})
          issues = json.load(urllib.request.urlopen(req))
          num = next((i['number'] for i in issues if '构建诊断' in i.get('title', '')), None)
          payload = json.dumps({'title': '[build] 构建诊断', 'body': body}).encode()
          url = f'https://api.github.com/repos/{repo}/issues' + (f'/{num}' if num else '')
          method = 'PATCH' if num else 'POST'
          req = urllib.request.Request(url, data=payload, method=method,
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json'})
          print('issue', urllib.request.urlopen(req).status)
          PYEOF
