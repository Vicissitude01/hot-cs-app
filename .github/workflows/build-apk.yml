name: build-apk
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test-log.txt
      - name: Build release APK
        run: gradle :app:assembleRelease 2>&1 | tee -a /tmp/test-log.txt
      - name: Inspect APK output
        run: |
          echo "### APK 输出目录" >> "$GITHUB_STEP_SUMMARY"
          ls -la app/build/outputs/apk/release/ 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(目录不存在)" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs -name "*.apk" 2>/dev/null | head -5 >> "$GITHUB_STEP_SUMMARY"
      - name: Show build log (always)
        if: always()
        run: |
          echo "### 构建输出（末尾）" >> "$GITHUB_STEP_SUMMARY"
          tail -150 /tmp/test-log.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(无日志)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/release/
          if-no-files-found: error
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "最新版" --notes "直接下载 app-release.apk 安装即可；首次打开请允许通知权限。" \
            app/build/outputs/apk/release/*.apk 2>/dev/null || \
          gh release upload latest app/build/outputs/apk/release/*.apk --clobber
