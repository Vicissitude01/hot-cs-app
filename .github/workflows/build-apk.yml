name: build-apk
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test-log.txt
      - name: Build release APK
        run: |
          gradle :app:assembleRelease --stacktrace 2>&1 | tee -a /tmp/test-log.txt
          echo "### assembleRelease 后 app/build 下的文件" >> /tmp/diag.txt
          find app/build -type f 2>/dev/null | head -40 >> /tmp/diag.txt || echo "(无 app/build)" >> /tmp/diag.txt
      - name: Locate and stage APK
        run: |
          echo "### APK 查找结果" >> /tmp/diag.txt
          find app/build/outputs -name "*.apk" 2>/dev/null | head -5 >> /tmp/diag.txt || true
          APK=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            mkdir -p dist && cp "$APK" dist/app-release.apk
            echo "已复制到 dist/app-release.apk" >> /tmp/diag.txt
          else
            echo "!! 未找到任何 APK 文件" >> /tmp/diag.txt
          fi
      - name: Show build log (always)
        if: always()
        run: |
          echo "### 编译错误行" >> /tmp/diag.txt
          grep -nE "e: |error:|FAILED|Compilation error" /tmp/test-log.txt 2>/dev/null | head -40 >> /tmp/diag.txt || true
          echo "### 构建输出（末尾）" >> /tmp/diag.txt
          tail -150 /tmp/test-log.txt >> /tmp/diag.txt 2>/dev/null || true
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/
          if-no-files-found: error
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "最新版" --notes "直接下载 app-release.apk 安装即可；首次打开请允许通知权限。" \
            dist/app-release.apk 2>/dev/null || \
          gh release upload latest dist/app-release.apk --clobber
      - name: Create diagnostic issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --search "构建诊断" --state open --json number -q '.[0].number' 2>/dev/null)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body "$(cat /tmp/diag.txt)" 2>/dev/null || true
          else
            gh issue create --title "[build] 构建诊断" --body "$(cat /tmp/diag.txt)" 2>/dev/null || true
          fi
